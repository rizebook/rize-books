        井上陽水さんは当時歌謡曲、演歌、ロック、フォークなどの中にあって
        新たな一分野を切り開いた方の中の一人です。
        独創的な歌詞の世界と斬新なメロディ、そして透明感のあるシャープな
        歌声が魅力的でした。
        当時　メディアに全く姿を見せない井上陽水さんでしたが
