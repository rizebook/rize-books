    <div class="comment-box">

        「打ち上げ花火」はDAOKOさんと米津玄師さんの歌唱による楽曲。
         ピアノソロから始まるイントロから夏の日のある一日の情景が静かに展開する中で、
         暗い夜空に「パッと光って咲いた！」と大きく開く鮮やかな花火が見えるようです。
         いつもは個性的な米津玄師さんの楽曲の中でもDAOKOさんが加わることで声の
         対比が面白い良い楽曲に仕上がっています。
