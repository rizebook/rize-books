    <div class="comment-box">

        岡本真夜さんのデビュー曲です。「涙の数だけ強くなれるよ」って名フレーズですね。
        テンポのいい曲に乗せた歌詞がしみます。
        どんなにつらく悲しいことがあってもそれがリセットされて、
        また明るい明日が来ると思うと勇気が出てきます。
        実際に当時、地震で被災された多くの方々がこの曲から元気、勇気をもらった
        と聞きました。
        きっと、明日は来るよ君のために～。
