<button id="bgm-button">
    ♪ BGM ON
</button>



<script>

const button =
document.getElementById("bgm-button");

const bgm =
document.getElementById("bgm");

bgm.volume = 0.15;



let playing =
localStorage.getItem("bgmPlaying")
=== "true";



if(playing){

    bgm.play();

    button.textContent =
    "♪ BGM OFF";

}else{

    button.textContent =
    "♪ BGM ON";
}



button.onclick = () => {

    if(!playing){

        bgm.play();

        button.textContent =
        "♪ BGM OFF";

        localStorage.setItem(
            "bgmPlaying",
            "true"
        );

    }else{

        bgm.pause();

        button.textContent =
        "♪ BGM ON";

        localStorage.setItem(
            "bgmPlaying",
            "false"
        );
    }

    playing = !playing;
};

</script>
